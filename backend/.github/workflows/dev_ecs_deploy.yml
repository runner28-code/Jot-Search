name: Dev - ECS Deployment

on:
  push:
    branches:
      - dev

env:
  AWS_REGION: 'us-east-1'
  ECR_REPOSITORY: 'site-backend'
  ECS_SERVICE: 'intulsa-backend-service-dev'
  ECS_CLUSTER: 'intulsa-cluster-dev'
  ECS_TASK_DEFINITION: '.github/workflows/dev_task_definition.json'
  CONTAINER_NAME: 'intulsa-backend-container-dev'

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: dev

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Add secrets to task definition
      uses: cschleiden/replace-tokens@v1
      with:
        files: ${{ env.ECS_TASK_DEFINITION }}
        tokenPrefix: '{'
        tokenSuffix: '}'
      env:
        SECRET_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        SECRET_AUTH_SECRET: ${{ secrets.DEV_AUTH_SECRET }}
        SECRET_GETRO_EMAIL: ${{ secrets.DEV_GETRO_EMAIL }}
        SECRET_GETRO_PASSWORD: ${{ secrets.DEV_GETRO_PASSWORD }}
        SECRET_BULLHORN_CLIENT_ID: ${{ secrets.DEV_BULLHORN_CLIENT_ID }}
        SECRET_BULLHORN_CLIENT_SECRET: ${{ secrets.DEV_BULLHORN_CLIENT_SECRET }}
        SECRET_BULLHORN_API_USERNAME: ${{ secrets.DEV_BULLHORN_API_USERNAME }}
