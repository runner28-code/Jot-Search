name: Prod - ECS Deployment

on:
  push:
    branches:
      - main

env:
  AWS_REGION: 'us-east-1'
  ECS_SERVICE: 'intulsa-frontend-service-prod'
  ECS_CLUSTER: 'intulsa-cluster-prod'
  ECS_TASK_DEFINITION: '.github/workflows/prod_task_definition.json'
  CONTAINER_NAME: 'intulsa-frontend-container-prod'

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v3
