name: Dev - ECS Deployment
on:
  push:
    branches:
      - dev

env:
  AWS_REGION: 'us-east-1'
  ECR_REPOSITORY: 'site-frontend'
  ECS_SERVICE: 'intulsa-frontend-service-dev'
  ECS_CLUSTER: 'intulsa-cluster-dev'
  ECS_TASK_DEFINITION: '.github/workflows/dev_task_definition.json'
  CONTAINER_NAME: 'intulsa-frontend-container-dev'

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: dev

