name: Dev - ECS Deployment

on:
  push:
    branches:
      - dev

env:
  AWS_REGION: 'us-east-1'
  ECR_REPOSITORY: 'site-frontend'
  ECS_SERVICE: 'intulsa-frontend-service-dev'
  ECS_CLUSTER: 'intulsa-cluster-dev'
  ECS_TASK_DEFINITION: '.github/workflows/dev_task_definition.json'
  CONTAINER_NAME: 'intulsa-frontend-container-dev'

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: dev

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
